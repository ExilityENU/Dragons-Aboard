pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri('https://maven.neoforged.net/releases') }
    }
}

plugins {
    // Auto-provisions JDK 21 if it is not installed locally
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'dragons-aboard'
